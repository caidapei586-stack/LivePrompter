name: Build iOS IPA on Cloud Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 检查并兼容直接上传的 ZIP 压缩包
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "检测到 ZIP 压缩包: $ZIP_FILE，正在自动解压..."
            unzip -o "$ZIP_FILE"
          fi
          # 自动定位包含 App/Models/Services/Views 的源码目录
          APP_FILE=$(find . -name "LivePrompterApp.swift" | head -n 1)
          if [ -z "$APP_FILE" ]; then
            echo "❌ 未找到源码文件 LivePrompterApp.swift，请确认代码已完整上传"
            exit 1
          fi
          SOURCE_DIR=$(dirname $(dirname "$APP_FILE"))
          PROJECT_DIR=$(dirname "$SOURCE_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: 3. 自动修复 project.yml 并生成 Xcode 工程
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat << 'EOF' > project.yml
          name: LivePrompter
          options:
            bundleIdPrefix: com.liveprompter
            deploymentTarget:
              iOS: "16.0"

          targets:
            LivePrompter:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: LivePrompter
              info:
                path: LivePrompter/Info.plist
                properties:
                  CFBundleDisplayName: 流光提词器
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: false
                  NSMicrophoneUsageDescription: "需要使用麦克风监听您的语速，以便实时自动滚动提词。"
                  NSSpeechRecognitionUsageDescription: "需要使用语音识别功能，实现台词智能跟读与自动跳转。"
                  UIBackgroundModes:
                    - audio
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.liveprompter.app
                  MARKETING_VERSION: 1.0.0
                  CURRENT_PROJECT_VERSION: 1
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 4. 使用云端 Xcode 编译 iOS 应用 (免证书模式)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild clean build \
            -project LivePrompter.xcodeproj \
            -scheme LivePrompter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 5. 封装打包成标准 .ipa 安装包
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "LivePrompter.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译产物 LivePrompter.app"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -q LivePrompter.ipa Payload

      - name: 6. 上传 .ipa 供浏览器直接下载
        uses: actions/upload-artifact@v4
        with:
          name: LivePrompter-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/LivePrompter.ipa
